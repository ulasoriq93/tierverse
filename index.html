<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c12">
  <meta name="description" content="Tierverse is a local-first personal ranking universe for tier lists, templates, comparisons, taste traits and shareable rankings.">
  <meta name="keywords" content="tier list, ranking, tier maker, offline app, personal rankings">
  <meta property="og:title" content="Tierverse — Your Personal Ranking Universe">
  <meta property="og:description" content="Rank anything. Change your mind. Build your taste profile locally and privately.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./assets/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <title>Tierverse — Your Personal Ranking Universe</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <script>
    try {
      const raw=localStorage.getItem('tierverse:v1');
      const pref=raw?JSON.parse(raw)?.settings?.theme:'dark';
      const resolved=pref==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):(pref==='light'?'light':'dark');
      document.documentElement.dataset.theme=resolved;
    } catch { document.documentElement.dataset.theme='dark'; }
  </script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <noscript><div class="noscript">Tierverse needs JavaScript enabled.</div></noscript>
  <div id="app"></div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <div id="modalHost" class="modal-host"></div>
  <script defer src="./data/config.js"></script>
  <script defer src="./js/utils.js"></script>
  <script defer src="./js/icons.js"></script>
  <script defer src="./js/storage.js"></script>
  <script defer src="./js/analytics.js"></script>
  <script defer src="./js/ui.js"></script>
  <script defer src="./js/share.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
